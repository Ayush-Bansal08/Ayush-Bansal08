o every browser</text><rect x="48" y="204" width="97" height="29" rx="14" fill="#151f2c" stroke="#2a3a4c"/><text x="60" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="500" fill="#9aa7b4" text-anchor="start" >Azure AKS</text><rect x="155" y="204" width="48" height="29" rx="14" fill="#151f2c" stroke="#2a3a4c"/><text x="167" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="500" fill="#9aa7b4" text-anchor="start" >ACR</text><rect x="213" y="204" width="356" height="29" rx="14" fill="#151f2c" stroke="#2a3a4c"/><text x="225" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="500" fill="#9aa7b4" text-anchor="start" >GitHub Actions + OIDC (no stored secrets)</text><rect x="579" y="204" width="129" height="29" rx="14" fill="#151f2c" stroke="#2a3a4c"/><text x="591" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="500" fill="#9aa7b4" text-anchor="start" >NGINX Ingress</text><rect x="718" y="204" width="153" height="29" rx="14" fill="#151f2c" stroke="#2a3a4c"/><text x="730" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="500" fill="#9aa7b4" text-anchor="start" >cert-manager TLS</text><rect x="881" y="204" width="227" height="29" rx="14" fill="#151f2c" stroke="#2a3a4c"/><text x="893" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="500" fill="#9aa7b4" text-anchor="start" >Prometheus ServiceMonitor</text>
