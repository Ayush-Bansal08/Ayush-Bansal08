<text x="48" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#9aa7b4" text-anchor="start" >Five services, three languages, one cluster</text><rect x="48.0" y="62" width="169.0" height="68" rx="10" fill="#151f2c" stroke="#2a3a4c"/><text x="132.5" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="middle" >Browser</text><text x="132.5" y="115.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#9aa7b4" text-anchor="middle" >vote</text><rect x="251.0" y="62" width="169.0" height="68" rx="10" fill="#151f2c" stroke="#2a3a4c"/><text x="335.5" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="middle" >Flask API</text><text x="335.5" y="115.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#9aa7b4" text-anchor="middle" >Python</text><path d="M220.0 96.0L248.0 96.0" fill="none" stroke="#6e7d8c" stroke-width="1.6" marker-end="url(#arr)"/><rect x="454.0" y="62" width="169.0" height="68" rx="10" fill="#0f2a2a" stroke="#2dd4bf"/><text x="538.5" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="middle" >Redis</text><text x="538.5" y="115.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#9aa7b4" text-anchor="middle" >queue</text><path d="M423.0 96.0L451.0 96.0" fill="none" stroke="#6e7d8c" stroke-width="1.6" marker-end="url(#arr)"/><rect x="657.0" y="62" width="169.0" height="68" rx="10" fill="#151f2c" stroke="#2a3a4c"/><text x="741.5" y="91.0" font-family="-a