<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="258" viewBox="0 0 1280 258" role="img" aria-labelledby="t d">
<title id="t">PollForge architecture</title><desc id="d">Browser to Flask API to Redis queue to .NET worker to PostgreSQL, with a Node.js Socket.IO service pushing live results; deployed to Azure AKS with ACR, OIDC GitHub Actions, NGINX ingress, cert-manager and Prometheus.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1018"/><stop offset="1" stop-color="#111c28"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2dd4bf" stroke-opacity=".06"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7d8c"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker>
</defs>
