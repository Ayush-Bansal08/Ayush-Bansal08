"#d0d7de"/><text x="428.0" y="223.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" >Every outcome, including refusals, is logged to 0G Storage</text><text x="428.0" y="247.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle" >request IDs · checks · policy result · tx hashes</text>
