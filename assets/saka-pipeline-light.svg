<title id="t">SAKA decision pipeline</title><desc id="d">Intent, plan via an unsigned-only MCP server, trade and hook scoring, simulation, an AI guard that fails closed, and a policy function that auto-runs, asks the user or refuses. Every outcome is logged to 0G Storage.</desc>
