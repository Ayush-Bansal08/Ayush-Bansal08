<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="334" viewBox="0 0 1280 334" role="img" aria-labelledby="t d">
<title id="t">Helios architecture</title><desc id="d">GitOps delivery from git push through GitHub Actions and ArgoCD to Argo Rollouts canaries analysed by Prometheus, with automatic rollback; and a custom Go operator that turns a pull request into an isolated preview namespace.</desc>
