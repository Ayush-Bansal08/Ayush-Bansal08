<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="292" viewBox="0 0 1280 292" role="img" aria-labelledby="t d">
<title id="t">DockHealer architecture</title><desc id="d">A local LLM proposes a Dockerfile; a 16-rule validator, a real docker build and a hardened smoke test decide. Failures are classified, redacted and fingerprinted for a bounded repair; project faults go to a human.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6f9"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f8f80" stroke-opacity=".06"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f8f80"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
</defs>
<rect x=".5" y=".5" width="1279" height="291" rx="14" fill="url(#bg)" stroke="#d0d7de"/>
<rect x=".5" y=".5" width="1279" height="291" rx="14" fill="url(#grid)"/>
<text x="48" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#57606a" text-anchor="start" >The model proposes. Deterministic code decides.</text><rect x="48.0" y="62" width="209.6" height="68" rx="10" fill="#f1edff" stroke="#6d4fd6"/><text x="152.8" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" >Local LLM</text><text x="152.8" y="115.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle" >Ollama · proposes</text><rect x="291.6" y="62" width="209.6" height="68" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="396.40000000000003" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" >Validator</text><text x="396.40000000000003" y="115.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle" >16 rules</text><path d="M260.6 96.0L288.6 96.0" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/><rect x="535.2" y="62" width="209.6" height="68" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="640.0" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" >docker build</text><text x="640.0" y="115.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle" >real build</text><path d="M504.20000000000005 96.0L532.2 96.0" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/><rect x="778.8" y="62" width="209.6" height="68" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="883.5999999999999" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" >Smoke test</text><text x="883.5999999999999" y="115.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle" >hardened container</text><path d="M747.8000000000001 96.0L775.8 96.0" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1022.4" y="62" width="209.6" height="68" rx="10" fill="#e6f6f3" stroke="#0f8f80"/><text x="1127.2" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" >Accepted</text><text x="1127.2" y="115.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="400" fill="#57606a" text-anchor="middle" >evidence attached</text><path d="M991.4 96.0L1019.4 96.0" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/><path d="M883.5999999999999 134C883.5999999999999 172 152.8 172 152.8 135" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrR)"/><text x="518.1999999999999" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="500" fill="#cf222e" text-anchor="middle" >failed? classify (22 classes) · redact logs · fingerprint · bounded retry</text><rect x="48" y="216" width="560" height="50" rx="10" fill="#fff4d6" stroke="#9a6700"/><text x="328.0" y="248.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle" >Project-level fault → stop and hand off to a human</text><text x="632" y="247" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#8c959f" text-anchor="start" >186 tests · injected fakes · Wilson 95% CIs · Terraform</text>
</svg>